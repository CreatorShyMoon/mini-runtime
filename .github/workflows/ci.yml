# Full pipeline mirror of .gitlab-ci.yml:
# lint -> build -> static-analysis -> test (unit + integration) -> sanitizers -> fuzz
#
# The integration test exercises real namespaces/pivot_root, so on GitHub
# runners it is executed via sudo (the script self-skips without root).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-format
      - run: git ls-files '*.cpp' '*.hpp' | xargs -r clang-format --dry-run --Werror

  build:
    name: build (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - run: >-
          sudo apt-get update -qq && sudo apt-get install -y -qq
          cmake ninja-build busybox-static
      - name: Build & unit tests
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            export CC=gcc CXX=g++
          else
            export CC=clang CXX=clang++
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DWERROR=ON
          cmake --build build
          ctest --test-dir build --output-on-failure -E integration
      - name: Integration (real namespaces, root)
        run: sudo ctest --test-dir build --output-on-failure -R integration

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build clang-tidy cppcheck
      - name: clang-tidy
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTING=OFF
          status=0
          for file in $(git ls-files 'src/*.cpp'); do
            echo "::group::clang-tidy $file"
            clang-tidy -p build --quiet "$file" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: cppcheck
        run: >-
          cppcheck --enable=warning,performance,portability --error-exitcode=1
          --inline-suppr --std=c++20 -I include src

  sanitizers:
    name: ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ASAN, UBSAN, TSAN]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build clang
      - name: Lower ASLR entropy (TSan needs mmap_rnd_bits <= 28)
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true
      - name: Build & test with ${{ matrix.sanitizer }}
        run: |
          export CC=clang CXX=clang++
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_${{ matrix.sanitizer }}=ON
          cmake --build build
          ctest --test-dir build --output-on-failure -E integration

  fuzz:
    name: libFuzzer (60s smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build clang libclang-rt-18-dev
      - name: Fuzz
        run: |
          export CC=clang CXX=clang++
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=OFF -DENABLE_FUZZING=ON -DENABLE_ASAN=ON
          cmake --build build
          ./build/fuzz/fuzz_cli -max_total_time=60 -print_final_stats=1
