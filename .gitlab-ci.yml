# Full pipeline: lint -> build -> static-analysis -> test -> sanitizers -> fuzz -> package
#
# Each stage maps to one CMake switch in CMakeLists.txt, so the exact same
# flags a job uses can be reproduced locally via docker compose.

stages:
  - lint
  - build
  - static-analysis
  - test
  - sanitizers
  - fuzz
  - package

variables:
  GIT_DEPTH: "0"
  GIT_STRATEGY: clone

default:
  image: ubuntu:24.04
  interruptible: true
  before_script:
    - apt-get update -qq
    - >-
      DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends
      build-essential cmake ninja-build git ca-certificates busybox-static
      clang libclang-rt-18-dev gcovr python3 > /dev/null

# ---------------------------------------------------------------------------
# lint
# ---------------------------------------------------------------------------
lint:clang-format:
  stage: lint
  before_script:
    - apt-get update -qq && apt-get install -y -qq clang-format > /dev/null
  script:
    - git ls-files '*.cpp' '*.hpp' | xargs -r clang-format --dry-run --Werror

# ---------------------------------------------------------------------------
# build: compiler x build-type matrix, warnings are errors
# ---------------------------------------------------------------------------
build:
  stage: build
  parallel:
    matrix:
      - COMPILER: [gcc, clang]
        BUILD_TYPE: [Debug, Release]
  script:
    - |
      if [ "$COMPILER" = "gcc" ]; then export CC=gcc CXX=g++; else export CC=clang CXX=clang++; fi
      echo "Building with $COMPILER / $BUILD_TYPE"
      cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DWERROR=ON
      cmake --build build
      ctest --test-dir build --output-on-failure

# ---------------------------------------------------------------------------
# static-analysis
# ---------------------------------------------------------------------------
static-analysis:clang-tidy:
  stage: static-analysis
  before_script:
    - apt-get update -qq && apt-get install -y -qq clang-tidy > /dev/null
  script:
    - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTING=OFF
    - |
      status=0
      for file in $(git ls-files 'src/*.cpp'); do
        echo ":: checking $file"
        clang-tidy -p build --quiet "$file" || status=1
      done
      exit $status

static-analysis:cppcheck:
  stage: static-analysis
  before_script:
    - apt-get update -qq && apt-get install -y -qq cppcheck > /dev/null
  script:
    - >-
      cppcheck --enable=warning,performance,portability --error-exitcode=1
      --inline-suppr --std=c++20 -I include src
  artifacts:
    when: always
    expire_in: 1 week

# ---------------------------------------------------------------------------
# test + coverage report (consumed by GitLab MR diff and badges)
# ---------------------------------------------------------------------------
test:coverage:
  stage: test
  script:
    - export CC=gcc CXX=g++
    - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON
    - cmake --build build
    - ctest --test-dir build --output-on-failure
    - cd build
    - >-
      gcovr -r "$CI_PROJECT_DIR" --object-directory .
      --filter "$CI_PROJECT_DIR/src/" --exclude "$CI_PROJECT_DIR/src/main.cpp"
      --print-summary
      --cobertura-pretty -o coverage.xml
      --html-details coverage/index.html
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: build/coverage.xml
    paths:
      - build/coverage/

# ---------------------------------------------------------------------------
# integration: real namespaces + pivot_root. Needs a privileged runner; the
# script self-skips (and passes) when it is not root.
# ---------------------------------------------------------------------------
test:integration:
  stage: test
  script:
    - export CC=gcc CXX=g++
    - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
    - cmake --build build
    - ctest --test-dir build --output-on-failure -R integration

# ---------------------------------------------------------------------------
# sanitizers: one job per checker (clang)
# ---------------------------------------------------------------------------
sanitizers:
  stage: sanitizers
  parallel:
    matrix:
      - SANITIZER: [ASAN, UBSAN, TSAN]
  script:
    - export CC=clang CXX=clang++
    - echo "Enabling $SANITIZER"
    - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_${SANITIZER}=ON
    - cmake --build build
    - ctest --test-dir build --output-on-failure -E integration

# ---------------------------------------------------------------------------
# fuzzing: bounded smoke run on every pipeline
# ---------------------------------------------------------------------------
fuzz:
  stage: fuzz
  timeout: 5m
  script:
    - export CC=clang CXX=clang++
    - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
        -DBUILD_TESTING=OFF -DENABLE_FUZZING=ON -DENABLE_ASAN=ON
    - cmake --build build
    - ./build/fuzz/fuzz_cli -max_total_time=60 -print_final_stats=1

# ---------------------------------------------------------------------------
# package: release tarball + container image
# ---------------------------------------------------------------------------
package:tarball:
  stage: package
  script:
    - export CC=gcc CXX=g++
    - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
    - cmake --build build
    - strip build/mini-ctr
    - tar -C build -czf "mini-runtime-${CI_COMMIT_SHORT_SHA}-linux-x86_64.tar.gz" mini-ctr
  artifacts:
    expire_in: 1 month
    paths:
      - mini-runtime-*.tar.gz

package:container:
  stage: package
  image: docker:27
  before_script: []
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -f docker/Dockerfile.runtime -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
